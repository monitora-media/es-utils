---
name: Build

on:
    push:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout project sources
              uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            # Release tags are <es_version>-<major>.<minor>, e.g. 8.19.23-1.0.
            # Branch builds use the versions in gradle.properties.
            - name: Resolve versions
              id: versions
              run: |
                  if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
                      if [[ "$GITHUB_REF_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+\.[0-9]+)$ ]]; then
                          echo "args=-Pelasticsearch.version=${BASH_REMATCH[1]} -Pplugin.version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
                      else
                          echo "::error::Tag '$GITHUB_REF_NAME' must be <es_version>-<major>.<minor>, e.g. 8.19.23-1.0"
                          exit 1
                      fi
                  fi

            - name: Build with Gradle Wrapper
              run: ./gradlew build ${{ steps.versions.outputs.args }}

            - name: Release
              uses: softprops/action-gh-release@v1
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  files: build/distributions/*.zip
